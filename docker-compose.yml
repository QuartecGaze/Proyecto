version: "3.8"

services:
  web:
    build: .
    container_name: web_php
    ports:
      - "8080:80"
    volumes:
      - ./Proyecto:/var/www/html:Z  # :Z para SELinux en RHEL
    depends_on:
      - db
    networks:
      - app_net

  db:
    image: mysql:8.0
    container_name: db_mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootAdministrador5749
      MYSQL_DATABASE: cooperativa
      MYSQL_USER: Administrador1
      MYSQL_PASSWORD: Administrador_8372
    volumes:
      - /home/proyecto/cooperativa.sql:/docker-entrypoint-initdb.d/cooperativa.sql
      - db_data:/var/lib/mysql
    networks:
      - app_net

networks:
  app_net:

volumes:
  db_data:

